name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per pip-installable tool subdir. Add new tools here.
        tool: ["sdr-sweep"]
        python-version: ["3.9", "3.12"]
    name: ${{ matrix.tool }} (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff build
      - name: Lint
        working-directory: ${{ matrix.tool }}
        run: ruff check .
      - name: Byte-compile
        working-directory: ${{ matrix.tool }}
        run: python -m compileall -q src
      - name: Build sdist + wheel
        working-directory: ${{ matrix.tool }}
        run: python -m build
      - name: Install the built wheel
        working-directory: ${{ matrix.tool }}
        run: python -m pip install "$(ls dist/*.whl)" pytest
      - name: Run tests
        working-directory: ${{ matrix.tool }}
        run: python -m pytest -q
      - name: CLI smoke (--help / --version)
        working-directory: ${{ matrix.tool }}
        run: |
          for cmd in sdr-sweep sdr-sweep-exporter sdr-sweep-report sdr-sweep-tui sdr-sweep-gaincal; do
            "$cmd" --version
            "$cmd" --help > /dev/null
          done
      # The behaviour tests are host-only: the capture path needs a USRP B210 and
      # the system `uhd` module (not on PyPI), so the radio itself is exercised by
      # a fake streamer in the tests, never real hardware in CI.
